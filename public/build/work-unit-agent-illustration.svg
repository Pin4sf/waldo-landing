<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="640" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1200" height="640" fill="#FFFFFF" />
    <rect x="624" y="0" width="576" height="640" fill="#1A1A1A" />

    <!-- Left panel: work unit -->
    <text x="48" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="0.04em" fill="#6B6B68">WORK UNIT &#183; #142</text>

    <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500" fill="#1A1A1A">
      <tspan x="48" y="102">Fix flaky auth retry</tspan>
      <tspan x="48" y="132">on cold start</tspan>
    </text>

    <rect x="48" y="156" width="54" height="26" rx="13" fill="none" stroke="rgba(26,26,26,0.12)" />
    <text x="75" y="173" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6B6B68">Bug</text>
    <rect x="112" y="156" width="52" height="26" rx="13" fill="none" stroke="rgba(26,26,26,0.12)" />
    <text x="138" y="173" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6B6B68">iOS</text>

    <line x1="48" y1="210" x2="576" y2="210" stroke="rgba(26,26,26,0.08)" />

    <text x="48" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="0.04em" fill="#6B6B68">ACTIVITY</text>

    <circle cx="64" cy="276" r="11" fill="#FB943F" />
    <text x="64" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" fill="#4A1B0C">S</text>
    <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
      <tspan x="86" y="273" font-weight="500" fill="#1A1A1A">sam</tspan>
      <tspan fill="#6B6B68"> &#183; 4 min ago</tspan>
    </text>
    <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6B6B68">
      <tspan x="86" y="294">Cold start sometimes retries auth before</tspan>
      <tspan x="86" y="312">the token refreshes.</tspan>
    </text>

    <circle cx="64" cy="352" r="11" fill="#1A1A1A" />
    <text x="64" y="356" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" fill="#FAFAF8">K</text>
    <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
      <tspan x="86" y="349" font-weight="500" fill="#1A1A1A">Kennel</tspan>
      <tspan fill="#6B6B68"> &#183; 2 min ago</tspan>
    </text>
    <text x="86" y="369" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6B6B68">Opened a draft PR for review.</text>

    <circle cx="64" cy="404" r="11" fill="none" stroke="rgba(26,26,26,0.15)" />
    <path d="M59 404 L63 408 L70 400" stroke="#6B6B68" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="86" y="408" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6B6B68">Moved to In review &#183; just now</text>

    <!-- Right panel: agent -->
    <text x="664" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500" fill="#FAFAF8">Kennel</text>
    <rect x="1032" y="48" width="104" height="26" rx="13" fill="none" stroke="rgba(255,255,255,0.16)" />
    <text x="1084" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Claude Code</text>

    <rect x="664" y="92" width="472" height="60" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
    <text x="684" y="128" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#FAFAF8">Fix the retry loop and open a PR</text>

    <text x="664" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Worked for 14s</text>

    <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)">
      <tspan x="664" y="212">Pushed and opened a draft PR. Backoff now waits</tspan>
      <tspan x="664" y="232">for token refresh before retrying.</tspan>
    </text>

    <rect x="664" y="256" width="472" height="104" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
    <text x="684" y="288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.75)">Changed 2 files</text>
    <text x="1082" y="288" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5DCAA5">+22</text>
    <text x="1116" y="288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#F0997B">-10</text>
    <text x="684" y="316" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.75)">Draft &#183; Fix retry backoff</text>
    <text x="684" y="340" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" fill="rgba(255,255,255,0.35)">main &#8592; fix/auth-142-retry-backoff</text>

    <rect x="664" y="560" width="472" height="44" rx="22" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
    <text x="684" y="587" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.35)">Reply&#8230;</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="639" rx="19.5" fill="none" stroke="rgba(26,26,26,0.08)" />
</svg>
